name: CI

# Runs on every push and pull request against main, so problems get caught
# before they land on the branch rather than being discovered later.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
        continue-on-error: true # formatting nits shouldn't block CI, just report them

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test
